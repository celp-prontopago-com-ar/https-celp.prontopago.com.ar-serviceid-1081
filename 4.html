<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pago con Tarjeta de Débito</title>
    <!-- Fuente Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        /* Encabezado al 100% para lograr la separación exacta */
        .header {
            width: 100%;
            border-bottom: 1px solid #dcdcdc;
            padding: 12px 0;
            background-color: #ffffff;
        }

        .header-content {
            width: 92%;
            max-width: 380px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-content img {
            height: 44px;
            width: auto;
            object-fit: contain;
        }

        .header-content h1 {
            font-size: 13.5px;
            font-weight: 500;
            color: #333333;
            margin: 0;
            text-align: right;
            line-height: 1.2;
        }

        /* Contenedor central maestro */
        .app-container {
            width: 92%;
            max-width: 380px;
            margin: 24px auto 30px auto;
        }

        /* Tarjeta Principal */
        .card-container {
            width: 100%;
            background-color: #dedede;
            border-radius: 0;
        }

        /* Imagen Verde de Pasos */
        .stepper-img {
            width: 100%;
            display: block;
            border-radius: 0;
        }

        /* Cuerpo del Formulario */
        .card-body {
            padding: 18px 16px 16px 16px;
        }

        .card-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #2b2b2b;
            margin-top: 0;
            margin-bottom: 8px; /* Reducido un poco para dar espacio al subtitulo */
            line-height: 1.3;
        }

        /* Subtítulo de Fiserv */
        .card-subtitle {
            font-size: 11px;
            color: #555555;
            margin-top: 0;
            margin-bottom: 18px;
            line-height: 1.4;
            font-weight: 400;
        }

        /* Grupos de Inputs */
        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: #333333;
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            height: 38px;
            padding: 0 10px;
            border: none;
            border-radius: 3px;
            background-color: #f4f7f9; /* Color gris muy clarito casi blanco, idéntico a la foto */
            font-family: 'Montserrat', sans-serif;
            font-size: 12.5px;
            color: #333333;
            outline: none;
        }

        .input-group input:focus, 
        .input-group input.has-value {
            background-color: #e8f0fe !important;
        }

        /* Línea Divisora */
        .divider {
            border: none;
            border-top: 1px solid #cfcfcf;
            margin: 18px 0 14px 0;
        }

        /* Botones Anterior y Próximo (Con los tamaños perfectos del paso anterior) */
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-anterior {
            background-color: #cbe5d2;
            color: #4a4a4a;
            border: none;
            padding: 9px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }

        .btn-seleccionar {
            background-color: #1e873b;
            color: #ffffff;
            border: none;
            padding: 9px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600; 
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <img src="logo.png" alt="CELP">
            <h1>Pago con Tarjeta de Débito</h1>
        </div>
    </header>

    <!-- Contenedor Maestro -->
    <div class="app-container">

        <!-- Tarjeta Principal -->
        <div class="card-container">
            <!-- Usando la imagen 4.jpg tal cual pediste -->
            <img src="img/4.jpg" alt="Pasos" class="stepper-img">

            <div class="card-body">
                <h2 class="card-title">Por favor, ingresá los siguientes datos</h2>
                <p class="card-subtitle">Al presionar INICIAR PAGO serás redirigido a Fiserv para completar los datos de tu tarjeta de débito</p>

                <div class="input-group">
                    <label>Dirección de E-Mail</label>
                    <input type="email" id="input-email" placeholder="">
                </div>

                <hr class="divider">

                <div class="actions">
                    <a href="3.html" class="btn-anterior" style="text-decoration: none; display: inline-block;">ANTERIOR</a>
                    <a href="5.html" class="btn-seleccionar" style="text-decoration: none; display: inline-block;">PRÓXIMO</a>
                </div>

            </div>
        </div>

    </div>

    <!-- Script de interactividad -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const inputEmail = document.getElementById("input-email");

            inputEmail.addEventListener("input", function() {
                if (this.value.trim().length > 0) {
                    this.classList.add("has-value");
                } else {
                    this.classList.remove("has-value");
                }
            });
        });
    </script>

</body>
</html>
